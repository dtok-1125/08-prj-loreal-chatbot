<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0b" />
    <title>L'Oréal Beauty Assistant</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <header class="site-header">
        <div class="brand">
          <img
            class="brand-logo"
            src="img/loreal-logo.png"
            alt="L'Oréal"
          />
          <span class="brand-divider" aria-hidden="true"></span>
          <span class="brand-subtitle">YOUR PERSONAL BEAUTY ASSISTANT</span>
        </div>
      </header>

      <main>
        <section class="consultation" aria-labelledby="welcomeTitle">
          <div class="intro">
            <p class="eyebrow">A MOMENT, JUST FOR YOU</p>
            <h1 id="welcomeTitle">Your beauty journey<br />begins here.</h1>
            <p class="intro-copy">
              Discover products, explore routines, and find what makes you feel
              beautiful.
            </p>
          </div>

          <section class="chatbox" aria-label="Beauty consultation chat">
            <div class="chat-toolbar">
              <button
                type="button"
                id="startNewBtn"
                class="start-new-button"
                aria-label="Start a new consultation"
              >
                <span class="material-icons" aria-hidden="true">restart_alt</span>
                <span>Start New</span>
              </button>
            </div>
            <div
              id="chatWindow"
              class="chat-window"
              role="log"
              aria-live="polite"
              aria-relevant="additions text"
            >
              <!-- Messages will be added here by the chat script. -->
              <div
                id="starterSuggestions"
                class="starter-suggestions"
                role="group"
                aria-label="Conversation starters"
              >
                <button
                  class="starter-button"
                  type="button"
                  data-question="Help me build a skincare routine."
                >
                  <span class="starter-mark" aria-hidden="true">✦</span>
                  <span>Help me build a skincare routine.</span>
                </button>
                <button
                  class="starter-button"
                  type="button"
                  data-question="What's the best mascara for me?"
                >
                  <span class="starter-mark" aria-hidden="true">✦</span>
                  <span>What's the best mascara for me?</span>
                </button>
                <button
                  class="starter-button"
                  type="button"
                  data-question="How can I care for dry hair?"
                >
                  <span class="starter-mark" aria-hidden="true">✦</span>
                  <span>How can I care for dry hair?</span>
                </button>
              </div>
            </div>

            <form id="chatForm" class="chat-form">
              <label for="userInput" class="visually-hidden">Your message</label>
              <input
                id="userInput"
                name="userInput"
                type="text"
                placeholder="Ask about products or routines..."
                autocomplete="off"
                required
              />
              <button type="submit" id="sendBtn">
                <span class="material-icons" aria-hidden="true">
                  arrow_upward
                </span>
                <span class="visually-hidden">Send message</span>
              </button>
            </form>
            <p class="chat-note">A little inspiration, one conversation at a time.</p>
          </section>
        </section>
      </main>

      <footer class="site-footer">
        <span class="footer-mark" aria-hidden="true"></span>
        <p>
          A beauty consultation project inspired by L'Oréal
          <span aria-hidden="true">·</span> An independent concept
        </p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
